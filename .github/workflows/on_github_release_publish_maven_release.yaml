name: On GitHub release created

on:
  release:
    types:
      - created
  
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Write testcontainers configuration file
        uses: DamianReeves/write-file-action@master
        with:
          path: ${{ env.home}}/.testcontainers.properties
          contents: |
            testcontainers.reuse.enable=true
      - id: release_number
        name: Get release version number to have it injected into maven
        uses: cardinalby/git-get-release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          latest: true
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: adopt
          java-version: 21
          cache: 'maven'
      - name: Publish package
        run: |
          mvn --batch-mode deploy \
            -Dtech-lab-ingester.stackexchange.api.key=${STACKEXCHANGE_TOKEN} \
            -Dtech-lab-ingester.bigQuery.projectId=${GCP_PROJECT_ID} \
            -Dtech-lab-ingester.github.token=${GITHUB_TOKEN} \
            -Dtech-lab-ingester.libraries.io.token=${LIBRARIES_IO_TOKEN}
        env:
          STACKEXCHANGE_TOKEN: ${{secrets.STACKEXCHANGE_TOKEN}}
          GCP_PROJECT_ID: ${{secrets.GCP_PROJECT_ID}}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBRARIES_IO_TOKEN: ${{ secrets.LIBRARIES_IO_TOKEN }}